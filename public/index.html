<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KASA — Günlük Gelir Gider Takibi</title>
<style>
:root{
  --kagit:#f4f1ea;
  --kart:#ffffff;
  --cizgi:#ded7c9;
  --murekkep:#2b2a26;
  --soluk:#7a7469;
  --yesil:#1f7a52;
  --yesil-zemin:#e6f2ec;
  --kirmizi:#b03a2e;
  --kirmizi-zemin:#fbeae8;
  --vurgu:#8a6d3b;
  --golge:0 1px 2px rgba(43,42,38,.06), 0 6px 18px rgba(43,42,38,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding:clamp(14px,3vw,34px);
  background:var(--kagit);
  color:var(--murekkep);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:clamp(14px,1.05vw + 10px,16px);
  line-height:1.5;
  overflow-y:auto;
}
.sarmal{max-width:1080px;margin:0 auto}

header.ust{
  display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;
  padding-bottom:14px;margin-bottom:20px;border-bottom:2px solid var(--cizgi);
}
.marka{display:flex;align-items:baseline;gap:10px}
.marka h1{
  margin:0;font-size:clamp(22px,3.4vw,32px);letter-spacing:.16em;font-weight:700;
}
.marka span{color:var(--soluk);font-size:.82em}
.tarih-not{color:var(--soluk);font-size:.85em;text-align:right}

.duzen{
  display:grid;gap:18px;
  grid-template-columns:minmax(280px,340px) 1fr;
  align-items:start;
}
@media (max-width:820px){
  .duzen{grid-template-columns:1fr}
}

.panel{
  background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;
  box-shadow:var(--golge);padding:clamp(14px,2.2vw,20px);
}
.panel h2{
  margin:0 0 14px;font-size:1.02em;letter-spacing:.06em;text-transform:uppercase;
  color:var(--soluk);font-weight:600;
}

label{display:block;margin-bottom:12px;font-size:.92em;color:var(--soluk)}
input,select{
  display:block;width:100%;margin-top:5px;padding:10px 11px;
  min-height:44px;font-size:1em;font-family:inherit;color:var(--murekkep);
  background:#fdfcf9;border:1px solid var(--cizgi);border-radius:8px;
}
input:focus,select:focus{outline:2px solid var(--vurgu);outline-offset:1px}

.tur-sec{display:flex;gap:8px;margin-bottom:12px}
.tur-sec button{
  flex:1;min-height:44px;padding:8px;font-family:inherit;font-size:.95em;font-weight:600;
  border:1px solid var(--cizgi);border-radius:8px;background:#fdfcf9;color:var(--soluk);
  cursor:pointer;transition:.15s;
}
.tur-sec button[aria-pressed="true"][data-tur="gelir"]{background:var(--yesil-zemin);border-color:var(--yesil);color:var(--yesil)}
.tur-sec button[aria-pressed="true"][data-tur="gider"]{background:var(--kirmizi-zemin);border-color:var(--kirmizi);color:var(--kirmizi)}

.gonder{
  width:100%;min-height:46px;padding:11px;font-size:1em;font-family:inherit;font-weight:700;
  letter-spacing:.04em;color:#fff;background:var(--murekkep);border:0;border-radius:8px;cursor:pointer;
}
.gonder:hover{background:#413f39}
.gonder:disabled{opacity:.55;cursor:progress}

.uyari{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.9em;display:none}
.uyari.hata{display:block;background:var(--kirmizi-zemin);color:var(--kirmizi);border:1px solid #efc7c1}
.uyari.tamam{display:block;background:var(--yesil-zemin);color:var(--yesil);border:1px solid #bfe0ce}

.ay-sec{margin-bottom:14px}
.kartlar{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);margin-bottom:18px}
@media (max-width:620px){.kartlar{grid-template-columns:1fr}}
.kart{
  padding:14px 16px;border-radius:12px;border:1px solid var(--cizgi);background:var(--kart);
  box-shadow:var(--golge);
}
.kart .etiket{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--soluk)}
.kart .deger{font-size:clamp(19px,2.6vw,25px);font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kart.gelir{background:var(--yesil-zemin);border-color:#bfe0ce}
.kart.gelir .deger{color:var(--yesil)}
.kart.gider{background:var(--kirmizi-zemin);border-color:#efc7c1}
.kart.gider .deger{color:var(--kirmizi)}
.kart.net .deger.eki{color:var(--kirmizi)}
.kart .alt{font-size:.82em;color:var(--soluk);margin-top:4px}

.tablo-sarmal{overflow-x:auto;border:1px solid var(--cizgi);border-radius:10px;background:var(--kart)}
table{width:100%;border-collapse:collapse;font-size:.92em}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--cizgi);white-space:nowrap}
td.aciklama{white-space:normal;min-width:150px}
th{background:#faf8f3;font-size:.82em;letter-spacing:.05em;text-transform:uppercase;color:var(--soluk);font-weight:600}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#faf8f3}
.tutar{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.gelir-metin{color:var(--yesil)}
.gider-metin{color:var(--kirmizi)}
.rozet{
  display:inline-block;padding:2px 8px;border-radius:20px;font-size:.8em;font-weight:600;
  background:#efece4;color:var(--soluk);
}
.bos{padding:26px 16px;text-align:center;color:var(--soluk);font-size:.92em}
.kat-liste{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.kat-pul{padding:6px 10px;border-radius:8px;background:#faf8f3;border:1px solid var(--cizgi);font-size:.85em}
.kat-pul b{font-weight:600}
.alt-bilgi{margin-top:22px;text-align:center;color:var(--soluk);font-size:.82em}
</style>
</head>
<body>
<div class="sarmal">

  <header class="ust">
    <div class="marka">
      <h1>KASA</h1>
      <span>günlük gelir · gider defteri</span>
    </div>
    <div class="tarih-not" id="gunNotu">—</div>
  </header>

  <div class="duzen">

    <!-- SOL: kayıt formu -->
    <section class="panel">
      <h2>Yeni Kayıt</h2>

      <div class="tur-sec">
        <button type="button" data-tur="gelir" aria-pressed="false" id="btnGelir">Gelir</button>
        <button type="button" data-tur="gider" aria-pressed="false" id="btnGider">Gider</button>
      </div>

      <form id="kayitFormu" autocomplete="off">
        <label>Tutar (₺)
          <input type="text" inputmode="decimal" id="tutar" placeholder="0,00" required>
        </label>

        <label>Açıklama
          <input type="text" id="aciklama" maxlength="200" placeholder="Örn. günlük yevmiye" required>
        </label>

        <label>Tarih
          <input type="date" id="tarih" required>
        </label>

        <label>Kategori
          <input type="text" id="kategori" maxlength="60" placeholder="Boş bırakılırsa: Genel">
        </label>

        <button type="submit" class="gonder" id="kaydetBtn">KASAYA YAZ</button>
        <div class="uyari" id="uyari"></div>
      </form>
    </section>

    <!-- SAĞ: özet + liste -->
    <section>
      <div class="panel" style="margin-bottom:18px">
        <h2>Özet</h2>

        <label class="ay-sec">Ay
          <input type="month" id="ay" required>
        </label>

        <div class="kartlar">
          <div class="kart gelir">
            <div class="etiket">Gelir</div>
            <div class="deger" id="ozetGelir">0,00 ₺</div>
          </div>
          <div class="kart gider">
            <div class="etiket">Gider</div>
            <div class="deger" id="ozetGider">0,00 ₺</div>
          </div>
          <div class="kart net">
            <div class="etiket">Net</div>
            <div class="deger" id="ozetNet">0,00 ₺</div>
            <div class="alt" id="ozetAdet">0 kayıt</div>
          </div>
        </div>

        <div id="kategoriAlan">
          <div class="etiket" style="font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--soluk);margin-bottom:6px">Kategoriler</div>
          <div class="kat-liste" id="kategoriListe"><span style="color:var(--soluk);font-size:.9em">Bu ayda kayıt yok.</span></div>
        </div>
      </div>

      <div class="panel">
        <h2>Kayıtlar</h2>
        <div class="tablo-sarmal">
          <table>
            <thead>
              <tr>
                <th>Tarih</th>
                <th>Kategori</th>
                <th>Açıklama</th>
                <th style="text-align:right">Tutar</th>
              </tr>
            </thead>
            <tbody id="listeGovde">
              <tr><td colspan="4" class="bos">Yükleniyor…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <div class="alt-bilgi">KASA · yerel sunucu · veriler <code>kasa.json</code> dosyasında saklanır</div>
</div>

<script>
(function () {
  "use strict";

  var tur = "gelir";

  var $ = function (id) { return document.getElementById(id); };
  var btnGelir = $("btnGelir"), btnGider = $("btnGider");
  var form = $("kayitFormu"), uyari = $("uyari"), kaydetBtn = $("kaydetBtn");
  var tarihGirdi = $("tarih"), ayGirdi = $("ay");

  /* --- yardımcılar --- */
  function ikiHane(n) { return (n < 10 ? "0" : "") + n; }

  function bugunIso() {
    var d = new Date();
    return d.getFullYear() + "-" + ikiHane(d.getMonth() + 1) + "-" + ikiHane(d.getDate());
  }

  function paraMetin(deger) {
    var sayi = Number(deger) || 0;
    return sayi.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺";
  }

  function sayiMetin(deger) {
    var sayi = Number(deger) || 0;
    return sayi.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function uyariGoster(mesaj, tip) {
    uyari.textContent = mesaj;
    uyari.className = "uyari " + (tip || "hata");
  }
  function uyariTemizle() {
    uyari.textContent = "";
    uyari.className = "uyari";
  }

  /* --- tür seçimi --- */
  function turAyarla(yeni) {
    tur = yeni;
    btnGelir.setAttribute("aria-pressed", String(yeni === "gelir"));
    btnGider.setAttribute("aria-pressed", String(yeni === "gider"));
  }
  btnGelir.addEventListener("click", function () { turAyarla("gelir"); });
  btnGider.addEventListener("click", function () { turAyarla("gider"); });

  /* --- form gönderimi --- */
  form.addEventListener("submit", function (olay) {
    olay.preventDefault();
    uyariTemizle();

    var tutarHam = $("tutar").value.trim().replace(",", ".");

    if (tutarHam === "" || isNaN(Number(tutarHam))) {
      uyariGoster("Tutar geçerli bir sayı olmalı.");
      return;
    }

    var govde = {
      tur: tur,
      tutar: Number(tutarHam),
      aciklama: $("aciklama").value.trim(),
      tarih: tarihGirdi.value,
      kategori: $("kategori").value.trim()
    };

    kaydetBtn.disabled = true;

    fetch("/api/kayit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(govde)
    })
      .then(function (yanit) {
        return yanit.json().then(function (veri) { return { kod: yanit.status, veri: veri }; });
      })
      .then(function (sonuc) {
        if (sonuc.kod !== 201) {
          uyariGoster(sonuc.veri && sonuc.veri.hata ? sonuc.veri.hata : "Kayıt eklenemedi.");
          return;
        }
        var k = sonuc.veri;
        uyariGoster(k.tur === "gelir" ? "Gelir kaydedildi: " + sayiMetin(k.tutar) + " ₺" : "Gider kaydedildi: " + sayiMetin(k.tutar) + " ₺", "tamam");
        $("tutar").value = "";
        $("aciklama").value = "";
        $("kategori").value = "";
        $("aciklama").focus();
        yenile();
      })
      .catch(function (hata) {
        uyariGoster("Sunucuya ulaşılamadı: " + hata.message);
      })
      .then(function () { kaydetBtn.disabled = false; });
  });

  /* --- listeleme --- */
  function listele() {
    var govde = $("listeGovde");
    return fetch("/api/kayitlar")
      .then(function (r) { return r.json(); })
      .then(function (kayitlar) {
        if (!Array.isArray(kayitlar) || kayitlar.length === 0) {
          govde.innerHTML = '<tr><td colspan="4" class="bos">Henüz kayıt yok. Soldaki formdan ilk kaydı ekleyin.</td></tr>';
          return;
        }
        var html = "";
        for (var i = 0; i < kayitlar.length; i++) {
          var k = kayitlar[i];
          var gelirMi = k.tur === "gelir";
          html += "<tr>";
          html += "<td>" + k.tarih + "</td>";
          html += '<td><span class="rozet">' + kacir(k.kategori) + "</span></td>";
          html += '<td class="aciklama">' + kacir(k.aciklama) + "</td>";
          html += '<td class="tutar ' + (gelirMi ? "gelir-metin" : "gider-metin") + '">' +
                  (gelirMi ? "+" : "−") + sayiMetin(k.tutar) + " ₺</td>";
          html += "</tr>";
        }
        govde.innerHTML = html;
      })
      .catch(function () {
        govde.innerHTML = '<tr><td colspan="4" class="bos">Kayıtlar yüklenemedi.</td></tr>';
      });
  }

  function kacir(metin) {
    return String(metin == null ? "" : metin)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* --- özet --- */
  function ozet() {
    var ay = ayGirdi.value;
    if (!ay) return Promise.resolve();

    return fetch("/api/ozet?ay=" + encodeURIComponent(ay))
      .then(function (r) { return r.json(); })
      .then(function (o) {
        $("ozetGelir").textContent = paraMetin(o.gelir);
        $("ozetGider").textContent = paraMetin(o.gider);
        var netEl = $("ozetNet");
        netEl.textContent = (o.net < 0 ? "−" : "") + paraMetin(Math.abs(o.net));
        netEl.className = "deger" + (o.net < 0 ? " eki" : "");
        $("ozetAdet").textContent = o.kayitSayisi + " kayıt";

        var liste = $("kategoriListe");
        var adlar = Object.keys(o.kategoriler || {});
        if (adlar.length === 0) {
          liste.innerHTML = '<span style="color:var(--soluk);font-size:.9em">Bu ayda kayıt yok.</span>';
          return;
        }
        var html = "";
        adlar.forEach(function (ad) {
          var k = o.kategoriler[ad];
          var parca = [];
          if (k.gelir) parca.push('<span class="gelir-metin">+' + sayiMetin(k.gelir) + "</span>");
          if (k.gider) parca.push('<span class="gider-metin">−' + sayiMetin(k.gider) + "</span>");
          html += '<span class="kat-pul"><b>' + kacir(ad) + "</b> · " + parca.join(" / ") + "</span>";
        });
        liste.innerHTML = html;
      })
      .catch(function () { /* sessiz: özet hatası listeyi engellemesin */ });
  }

  function yenile() {
    listele();
    ozet();
  }

  ayGirdi.addEventListener("change", ozet);

  /* --- başlangıç --- */
  var simdi = new Date();
  tarihGirdi.value = bugunIso();
  ayGirdi.value = simdi.getFullYear() + "-" + ikiHane(simdi.getMonth() + 1);
  $("gunNotu").textContent = simdi.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric", weekday: "long" });
  turAyarla("gelir");
  yenile();
})();
</script>
</body>
</html>
